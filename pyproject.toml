[project]
name = "autojob"
version = "0.1.0"
description = "Personal job-hunting bot: scans job sites, researches companies, applies, and reports on a dashboard."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pypdf>=6.19.0",
    "selectolax>=0.4.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autojob"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
